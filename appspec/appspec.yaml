# CodeDeploy AppSpec for ECS blue/green.
#
# This file belongs in the APPLICATION repository and is zipped together with
# taskdef.json into config.zip, then uploaded to the deploy-config bucket. It is
# included here only as the canonical reference.
#
# <TASK_DEFINITION> is a placeholder that CodeDeploy replaces at deploy time with
# the task definition it registers from taskdef.json.

version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION>
        LoadBalancerInfo:
          ContainerName: "todo-app"
          ContainerPort: 8080
        PlatformVersion: "LATEST"
